    <div class="set-row"><div class="l"><b>${U("reset")}</b>${confirmReset ? `<span>${U("resetSure")}</span>` : ""}</div>${confirmReset ? `<div style="display:flex;gap:8px"><button class="btn small" data-s="resetYes">${U("resetYes")}</button><button class="btn ghost small" data-s="resetNo">${U("resetNo")}</button></div>` : `<button class="btn ghost small" data-s="reset">${U("reset")}</button>`}</div>
  </div>`;
  const m = openModal(html(), (e) => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    AudioSys.init(); AudioSys.sfx("click");
    const [k, v] = b.dataset.s.split(":");
    if (k === "lang") { setLang(v); }
    else if (k === "level") { S.level = v; save(); }
    else if (k === "narr") { S.narr = v === "1"; if (!S.narr) Voice.stop(); save(); }
    else if (k === "musicOn") { S.musicOn = v === "1"; save(); AudioSys.applyVol(); }
    else if (k === "sfxOn") { S.sfxOn = v === "1"; save(); AudioSys.applyVol(); }
    else if (k === "reset") confirmReset = true;
    else if (k === "resetNo") confirmReset = false;
    else if (k === "resetYes") { S.done = {}; S.resume = null; S.seenPrologue = false; save(); closeModal(); showTitle(); return; }
    else if (k === "change") { closeModal(); showTitle(); return; }
    else if (k === "backup") { closeModal(); openBackup(); return; }
    m.innerHTML = html(); bind(); renderHud(hudState.kind, hudState.ch, hudState.step);
  }, () => { m.innerHTML = html(); bind(); });
  function bind() {
    const n = $("#setName"); if (n) n.oninput = () => { S.name = n.value.trim().slice(0, 14); save(); };
    const mu = $("#setMusic"); if (mu) mu.oninput = () => { S.music = +mu.value; save(); AudioSys.applyVol(); };
    const sf = $("#setSfx"); if (sf) sf.oninput = () => { S.sfx = +sf.value; save(); AudioSys.applyVol(); };
  }
  bind();
}
const _setLang = setLang;
setLang = function (l) { _setLang(l); if (modalRerender) modalRerender(); };

/* ---------------- BOOT ---------------- */
function boot() {
  loadSave();
  document.documentElement.lang = S.lang;
  document.addEventListener("pointerdown", () => AudioSys.init(), { once: false });
  showTitle();
}


/* =====================================================================
   CAPÍTULO 1 · TALES — «Mito o Logos» + «El eclipse del 585 a.C.»
   ===================================================================== */
GAMES.tales = async function (ch) {
  const m1 = await mitoLogos(ch);
  const m2 = await eclipseGame(ch);
  return { stars: starsFromMistakes(m1 + m2) };
};

function mitoLogos(ch) {
  AudioSys.setMood("challenge");
  setScene("miletus", { dim: 1 });
  let cards = ch.mito.cards.filter(c => !c.pro || isPhi());
  const trap = cards.find(c => c.trap);
  cards = shuffle(cards.filter(c => !c.trap));
  cards.splice(cards.length - 1, 0, trap);
  const results = cards.map(() => null);
  let i = 0, mistakes = 0, answered = null;
  return ask(done => {
    const ui = $("#ui");
    function draw() {
      const c = cards[i];
      ui.innerHTML = `<div class="ch-wrap">
        <div class="ch-head"><div class="ins">${T(ch.mito.intro)}</div>${pipsHtml(results, i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>
        <div class="ml-board">
          <button class="ml-zone" data-a="mito"><svg viewBox="-30 -30 60 60" aria-hidden="true">${icon("bolt", P.goldHi)}</svg><b>${U("mito")}</b><span>${U("mitoSub")}</span><span class="k">←</span></button>
          <div class="ostrakon in" id="card"><svg viewBox="-30 -30 60 60" aria-hidden="true">${icon(c.icon, P.clayLo, P.clay)}</svg><div>${T(c.t)}</div></div>
          <button class="ml-zone" data-a="logos"><svg viewBox="-30 -30 60 60" aria-hidden="true">${icon("eye", P.goldHi)}</svg><b>${U("logos")}</b><span>${U("logosSub")}</span><span class="k">→</span></button>
        </div>
        <div id="fb" style="min-height:74px;display:flex;justify-content:center;width:100%"></div>
      </div>`;
      if (answered !== null) showFb(false);
      bindDrag();
    }
    function showFb(animate = true) {
      const c = cards[i]; const ok = answered === c.a;
      const card = $("#card"); if (card && animate) card.classList.add(answered === "mito" ? "toL" : "toR");
      else if (card) card.style.visibility = "hidden";
      $("#fb").innerHTML = feedbackHtml(ok, T(c.e));
      ui.querySelectorAll(".ml-zone").forEach(z => z.disabled = true);
    }
    function answer(a) {
      if (answered !== null) return;
      const c = cards[i]; answered = a;
      const ok = a === c.a;
      results[i] = ok ? 1 : 0; if (!ok) mistakes++;
      AudioSys.sfx(ok ? "ok" : "bad");
      showFb(true);
      ui.querySelector(".pips").outerHTML = pipsHtml(results, i);
      Voice.speak((ok ? U("wellDone") : U("notQuite")) + " " + T(c.e), "noctua");
    }
    function next() {
      answered = null; i++;
      if (i >= cards.length) { Voice.stop(); done(mistakes); return; }
      AudioSys.sfx("page"); draw(); Voice.speak(T(cards[i].t));
    }
    function bindDrag() {
      const card = $("#card"); if (!card) return;
      let sx = null;
      card.onpointerdown = e => { if (answered !== null) return; sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; };
      card.onpointermove = e => { if (sx === null) return; const dx = e.clientX - sx; card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; ui.querySelector('[data-a="mito"]').classList.toggle("hot", dx < -60); ui.querySelector('[data-a="logos"]').classList.toggle("hot", dx > 60); };
      card.onpointerup = e => {
        if (sx === null) return; const dx = e.clientX - sx; sx = null; card.style.transition = ""; card.style.transform = "";
        ui.querySelectorAll(".ml-zone").forEach(z => z.classList.remove("hot"));
        if (dx < -90) answer("mito"); else if (dx > 90) answer("logos");
      };
    }
    ui.onclick = e => {
      const z = e.target.closest("[data-a]"); if (z) { answer(z.dataset.a); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "fbnext") next();
      if (b.dataset.k === "say") Voice.speak(T(ch.mito.intro) + " " + T(cards[i].t));
    };
    keyH = e => {
      if (answered === null && (e.key === "ArrowLeft" || e.key.toLowerCase() === "m")) answer("mito");
      else if (answered === null && (e.key === "ArrowRight" || e.key.toLowerCase() === "l")) answer("logos");
      else if (answered !== null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
    };
    rerender = draw;
    draw();
    Voice.speak(T(ch.mito.intro) + " " + T(cards[0].t), "noctua");
  });
}

function eclipseGame(ch) {
  AudioSys.setMood("challenge");
  clearScene();
  const SUN = { x: 800, y: 300, r: 92 };
  const speed = isPhi() ? 430 : 300, tol = isPhi() ? 14 : 24;
  let tries = 0, misses = 0, won = false, mx = -150, last = 0, frozen = false, msg = null, helped = false;
  return ask(done => {
    const ui = $("#ui");
    function draw() {
      ui.innerHTML = `<div class="ecl"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect x="-300" y="-300" width="2200" height="1500" fill="${P.clayHi}"/>
        <rect id="eSky" x="-300" y="-300" width="2200" height="1500" fill="#0b1118" opacity="0"/>
        <g id="eStars" opacity="0">${stars(90, 33, 0, 0, 1600, 560)}</g>
        ${glow(SUN.x, SUN.y, 300, P.goldHi, 0.55)}
        <g id="corona" opacity="0">${glow(SUN.x, SUN.y, 230, "#fff3c8", 0.9)}</g>
        <circle cx="${SUN.x}" cy="${SUN.y}" r="${SUN.r}" fill="${P.goldHi}"/>
        <circle cx="${SUN.x}" cy="${SUN.y}" r="${SUN.r + 6}" fill="none" stroke="${P.slip}" stroke-width="2" stroke-dasharray="6 10" opacity=".7"/>
        <g id="moonG"><circle id="moon" cx="${mx}" cy="${SUN.y}" r="${SUN.r + 2}" fill="#2a1a12" stroke="#5e3a26" stroke-width="2"/></g>
        ${hill("M-300 900 L-300 690 C300 660 900 670 1900 690 L1900 900Z", P.clayLo)}
        <g id="armyL" style="transition:transform 3s ease 1s">${[0, 1, 2, 3, 4, 5].map(k => hoplite(80 + k * 70, 720 + (k % 2) * 14, 0.62, P.ink, P.clay, false, "round")).join("")}</g>
        <g id="armyR" style="transition:transform 3s ease 1s">${[0, 1, 2, 3, 4, 5].map(k => hoplite(1520 - k * 70, 720 + (k % 2) * 14, 0.62, P.ink, P.clay, true, "rect")).join("")}</g>
      </svg>
      <div class="ch-wrap" style="position:absolute;inset:0 0 auto 0;overflow:visible"><div class="ch-head"><div class="ins">${T(ch.eclipse.intro)}</div><div class="chip">${U("tries")}: ${Math.max(0, 3 - tries)}</div><button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div></div>
      <div class="ecl-ui">
        <div id="emsg" style="min-height:60px;display:flex;justify-content:center;width:100%">${msg || ""}</div>
        ${won ? `<button class="btn big gold" data-k="cont">${U("cont")} ${ICON.next}</button>` : `<button class="btn big" data-k="now" ${frozen ? "disabled" : ""}>${U("now")}</button>`}
      </div></div>`;
      paint();
    }
    function paint() {
      const moon = $("#moon"); if (!moon) return;
      moon.setAttribute("cx", mx.toFixed(1));
      const d = Math.abs(mx - SUN.x), cover = Math.max(0, 1 - d / (SUN.r * 2));
      $("#eSky").setAttribute("opacity", (won ? 0.9 : cover * 0.82).toFixed(3));
      $("#eStars").setAttribute("opacity", (won ? 1 : Math.max(0, cover - 0.6) * 2.2).toFixed(3));
      $("#corona").setAttribute("opacity", (won ? 1 : Math.max(0, cover - 0.85) * 5).toFixed(3));
    }
    function loop(t) {
      if (!last) last = t;
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!frozen && !won) { mx += speed * dt; if (mx > 1750) mx = -150; paint(); }
      rafId = requestAnimationFrame(loop);
    }
    function press() {
      if (won || frozen) return;
      const d = Math.abs(mx - SUN.x);
      tries++;
      if (d <= tol) { win(); return; }
      misses++; AudioSys.sfx("bad"); frozen = true;
      if (tries >= 3) {
        msg = feedbackHtml(false, T(ch.eclipse.help), false); helped = true;
        draw();
        later(() => { const anim = () => { mx += (SUN.x - mx) * 0.08; paint(); if (Math.abs(mx - SUN.x) > 0.5) rafId = requestAnimationFrame(anim); else win(); }; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(anim); }, 1200);
        return;
      }
      msg = feedbackHtml(false, T(ch.eclipse.miss), false);
      draw();
      later(() => { frozen = false; msg = null; draw(); }, 1300);
    }
    function win() {
      won = true; frozen = false; mx = SUN.x; cancelAnimationFrame(rafId);
      AudioSys.sfx("eclipse"); later(() => AudioSys.sfx("fanfare"), 1400);
      msg = feedbackHtml(true, T(ch.eclipse.win), false);
      draw();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const l = $("#armyL"), r = $("#armyR");
        if (l) l.style.transform = "translateX(-260px)"; if (r) r.style.transform = "translateX(260px)";
      }));
      Voice.speak(T(ch.eclipse.win), "noctua");
    }
    ui.onclick = e => {
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "now") press();
      if (b.dataset.k === "say") Voice.speak(T(ch.eclipse.intro), "noctua");
      if (b.dataset.k === "cont") { Voice.stop(); cancelAnimationFrame(rafId); done(helped ? 2 : Math.min(misses, 2)); }
    };
    keyH = e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (won) ui.querySelector("[data-k=cont]")?.click(); else press(); }
    };
    rerender = draw;
    draw();
    Voice.speak(T(ch.eclipse.intro), "noctua");
    rafId = requestAnimationFrame(loop);
  });
}


/* =====================================================================
   CAPÍTULO 2 · SÓCRATES — «Duelo en el ágora»
   Elegir la pregunta que pone a prueba una definición (contraejemplo),
   sin atacar a la persona ni darle la razón sin pensar.
   ===================================================================== */
const DUEL_LOOKS = {
  general: { garment: "short", hair: "none", beard: "short", helmet: true, front: "hold", back: "down", props: ["spear"] },
  elder:   { garment: "himation", hair: "bald", beard: "long", front: "staff", back: null, props: ["staff"] },
  sophist: { garment: "robe", hair: "curly", beard: "short", front: "hold", back: "hip", props: ["scroll"] },
  young:   { garment: "himation", hair: "curly", beard: "none", front: "out", back: null, props: [] }
};
function tondo(inner) {
  const id = uid("td");
  return `<defs><clipPath id="${id}"><circle cx="0" cy="-165" r="172"/></clipPath></defs>
    <circle cx="0" cy="-165" r="186" fill="${P.ink}"/><circle cx="0" cy="-165" r="172" fill="${P.clay}"/>
    <g clip-path="url(#${id})">${glow(0, -200, 200, P.clayHi, 0.6)}${inner}<rect x="-200" y="0" width="400" height="40" fill="${P.clayLo}"/></g>
    <circle cx="0" cy="-165" r="179" fill="none" stroke="${P.clay}" stroke-width="2" stroke-dasharray="10 6"/>`;
}
function duelFig(look, flip, extra = "") {
  const L = DUEL_LOOKS[look];
  return tondo(fig(Object.assign({ x: 0, y: 0, s: 0.95, flip, fill: P.ink, line: P.clay }, L)) + extra);
}
function socratesFig(pose = "out", extra = "") {
  return tondo(fig({ x: 0, y: 0, s: 0.95, fill: P.ink, line: P.clay, hair: "bald", beard: "full", nose: "snub", front: pose, back: "down" }) + extra);
}

GAMES.socrates = function (ch) {
  AudioSys.setMood("challenge");
  setScene("agora", { dim: 2 });
  setFog(0.5);
  const rounds = ch.duel.rounds.filter(r => !r.pro || isPhi());
  const results = rounds.map(() => null);
  let i = 0, mistakes = 0, solved = false, finished = false, wrong = new Set(), fb = "", hintShown = false;
  let order = shuffle(["good", "insult", "soft"]);
  return ask(done => {
    const ui = $("#ui");
    function fogPct() { return Math.round(100 * results.filter(x => x !== 1).length / rounds.length); }
    function draw() {
      const r = rounds[i];
      const head = `<div class="ch-head"><div class="ins">${T(ch.duel.intro)}</div><div class="fogmeter">${U("fogLeft")}<span class="bar"><i style="width:${fogPct()}%"></i></span></div>${pipsHtml(results, i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>`;
      if (finished) {
        ui.innerHTML = `<div class="ch-wrap">${head}<div class="duel"><div class="side me"><svg viewBox="-190 -355 380 375" aria-hidden="true">${socratesFig("up", gadfly(70, -290, 1.2))}</svg></div>
          <div class="side"><div class="center" style="display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;height:100%">${feedbackHtml(true, T(ch.duel.win), false)}<button class="btn big gold" data-k="end">${U("cont")} ${ICON.next}</button></div></div></div></div>`;
        return;
      }
      const opp = duelFig(r.look, true, solved ? qmark(-60, -250, 1.3, P.ink, "bob") + qmark(-100, -290, 0.8, P.ink, "bob") : "");
      ui.innerHTML = `<div class="ch-wrap">${head}
        <div class="duel">
          <div class="side me">${solved ? `<div class="speech s-left"><span class="who">${T(UI.speakers.socrates)}</span>${T(r.good)}</div>` : ""}<svg viewBox="-190 -355 380 375" aria-hidden="true">${socratesFig(solved ? "point" : "chin", solved ? gadfly(110, -250, 1.1) : "")}</svg></div>
          <div class="side"><div class="speech s-right ${solved ? "react" : ""}"><span class="who">${T(r.who)}</span>${solved ? T(r.react) : T(r.claim)}</div><svg viewBox="-190 -355 380 375" aria-hidden="true">${opp}</svg></div>
        </div>
        ${solved ? `<div style="display:flex;justify-content:center;gap:12px;align-items:center"><span class="chip">${r.src}</span><button class="btn big" data-k="next">${U("next")} ${ICON.next}</button></div>`
          : `<div class="opts">${order.map((k, n) => `<button class="opt ${wrong.has(k) ? "bad" : ""}" data-o="${k}" ${wrong.has(k) ? "disabled" : ""}><span class="n">${n + 1}</span><span>${T(r[k])}</span></button>`).join("")}</div>
             <div id="fb" style="display:flex;justify-content:center;gap:10px;min-height:56px;width:min(1100px,100%);align-items:center">${fb}${!isPhi() && !hintShown && !fb ? `<button class="btn ghost small" data-k="hint">${ICON.hint} ${U("hint")}</button>` : ""}</div>`}
      </div>`;
    }
    function choose(k) {
      if (solved || wrong.has(k)) return;
      const r = rounds[i];
      if (k === "good") {
        solved = true; if (results[i] === null) results[i] = 1;
        AudioSys.sfx("buzz"); later(() => AudioSys.sfx("ok"), 350);
        fb = ""; draw();
        Voice.speak(T(r.good) + " … " + T(r.react));
      } else {
        wrong.add(k); mistakes++;
        AudioSys.sfx("bad");
        fb = feedbackHtml(false, T(k === "insult" ? ch.duel.wrongInsult : ch.duel.wrongSoft), false);
        draw();
        ui.querySelector(".opts")?.classList.add("shake");
        Voice.speak(T(k === "insult" ? ch.duel.wrongInsult : ch.duel.wrongSoft), "noctua");
      }
    }
    function next() {
      if (!solved) return;
      i++; solved = false; wrong = new Set(); fb = ""; hintShown = false; order = shuffle(["good", "insult", "soft"]);
      if (i >= rounds.length) {
        finished = true; i = rounds.length - 1; setFog(0); AudioSys.sfx("fogout"); later(() => AudioSys.sfx("fanfare"), 600);
        draw(); Voice.speak(T(ch.duel.win), "noctua"); return;
      }
      AudioSys.sfx("page"); setFog(0.5 * fogPct() / 100);
      draw(); sayRound();
    }
    function sayRound() { const r = rounds[i]; Voice.speak(T(r.who) + ". " + T(r.claim)); }
    ui.onclick = e => {
      const o = e.target.closest("[data-o]"); if (o) { choose(o.dataset.o); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      const k = b.dataset.k;
      if (k === "next") next();
      if (k === "hint") { hintShown = true; fb = `<div class="feedback" style="border-color:var(--gold)"><span class="mark" style="color:var(--goldHi)">${U("hint")}</span><p>${T(ch.duel.hint)}</p></div>`; draw(); Voice.speak(T(ch.duel.hint), "noctua"); }
      if (k === "say") { finished ? Voice.speak(T(ch.duel.win)) : sayRound(); }
      if (k === "end") { Voice.stop(); done({ stars: starsFromMistakes(mistakes) }); }
    };
    keyH = e => {
      if (finished && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ui.querySelector("[data-k=end]")?.click(); return; }
      if (!solved && ["1", "2", "3"].includes(e.key)) { choose(order[+e.key - 1]); return; }
      if (solved && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); next(); }
    };
    rerender = draw;
    draw(); sayRound();
  });
};


/* =====================================================================
   CAPÍTULO 3 · PLATÓN — «La caverna»
   Fase 1: detective de sombras (mover la antorcha antes de decidir).
   Fase 2: la salida (ordenar lo que ve el prisionero, República VII).
   ===================================================================== */
const SH = "#0e0805";
function rr(x, y, w, h, r, fill, tr = "") { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${tr ? `transform="${tr}"` : ""}/>`; }
function dragonShape(fill) {
  return ell(0, 0, 120, 46, fill)
    + pth("M80 -20 C120 -60 130 -110 160 -130 L178 -112 C150 -96 140 -50 110 10Z", fill)
    + pth("M150 -140 C170 -160 210 -160 230 -140 L250 -126 L216 -118 C200 -110 176 -108 160 -112Z", fill)
    + pth("M168 -152 L160 -190 L182 -158Z M190 -156 L196 -196 L204 -154Z", fill)
    + pth("M-30 -36 C-60 -150 20 -210 60 -230 C40 -190 60 -170 40 -150 C70 -160 80 -140 60 -120 C90 -120 90 -96 70 -80 C40 -60 10 -50 -30 -36Z", fill)
    + pth("M-110 10 C-170 30 -210 70 -250 60 C-230 76 -200 90 -170 74 C-150 64 -130 40 -100 30Z", fill)
    + pth("M-250 60 L-290 40 L-280 70 L-300 90 L-262 78Z", fill)
    + limb([[-60, 30], [-66, 80]], fill, 18) + limb([[-20, 36], [-16, 84]], fill, 18) + limb([[50, 34], [56, 82]], fill, 18) + limb([[86, 26], [96, 74]], fill, 18);
}
function handPair(t, fill) {
  // t=0: sombra de pájaro (manos cruzadas por los pulgares); t=1: dos manos separadas con sus brazos
  const off = 170 * t, rot = 32 * t, spread = 1 - t;
  const side = (dir) => {
    let h = ell(0, 0, 46, 34, fill);
    for (let k = 0; k < 4; k++) {
      const ang = dir * (58 + k * (14 + 10 * spread));
      h += rr(-13, -4, 26, 120 - k * 8, 13, fill, `rotate(${ang.toFixed(1)} 0 0) translate(0 -${118 - k * 8})`);
    }
    h += rr(-12, -88, 24, 78, 12, fill, `rotate(${(dir * (-14 + 30 * t)).toFixed(1)} 0 -10)`);
    h += `<g opacity="${Math.min(1, t * 1.4).toFixed(2)}">${rr(-30, 16, 60, 320, 22, fill)}</g>`;
    return g(h, `translate(${(500 + dir * (30 + off)).toFixed(1)} 300) rotate(${(dir * rot).toFixed(1)})`);
  };
  const bird = `<g opacity="${Math.max(0, 1 - t * 2.2).toFixed(2)}">${ell(500, 300, 64, 40, fill)}${ell(500, 220, 30, 34, fill)}${pth("M524 206 L572 222 L524 236Z", fill)}${pth("M470 330 L500 380 L530 330Z", fill)}</g>`;
  return g(side(-1) + side(1) + bird, "translate(500 300) scale(1.25) translate(-500 -300)");
}
const SHADOWS = {
  cat(t, f = SH) {
    const s = 2.9 - 2.0 * t;
    return g(catShape(f), `translate(${430 - t * 60} 500) scale(${s})`) + g(amphora(0, 0, 1, f, f), "translate(800 500) scale(1.55)");

  cone(t, f = SH) {

    return pth(`M${bx} ${280 - r} L${ax} 280 L${bx} ${280 + r}Z`, f) + ell(bx, 280, rx, r, f);

  }
};

  cone: () => { const id = uid("cg"); return `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${P.clayLo}"/><stop offset=".5" stop-color="${P.clayHi}"/><stop offset="1" stop-color="${P.clayLo}"/></linearGradient></defs>` + pth("M-70 50 L0 -80 L70 50Z", `url(#${id})`) + ell(0, 50, 70, 16, P.clay); },

};

GAMES.platon = async function (ch) {
  const m1 = await shadowGame(ch);
  const m2 = await escapeGame(ch);
  return { stars: starsFromMistakes(m1 + Math.floor(m2 / 2)) };

function shadowGame(ch) {
  AudioSys.setMood("cave");
  setScene("caveWall");
  const puzzles = ch.cave.puzzles.filter(p => !p.pro || isPhi());
  const results = puzzles.map(() => null);
  let i = 0, t = 0, explored = false, answered = -1, mistakes = 0;
  return ask(done => {
    const ui = $("#ui");
    const fid = uid("blur");
    function shadow() {
      const p = puzzles[i];
      return `<defs><filter id="${fid}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter></defs><g filter="url(#${fid})" opacity=".9" class="wallflick">${SHADOWS[p.id](t)}</g>`;
    }
    function draw() {
      const p = puzzles[i];
      const truth = answered >= 0;
      ui.innerHTML = `<div class="cave-ui">
        <div class="ch-head"><div class="ins">${T(ch.cave.intro)}</div>${pipsHtml(results, i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>
        <div class="cave-stage"><svg id="shadowSvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${shadow()}</svg>
          ${truth ? `<svg viewBox="-160 -150 320 300" style="left:auto;right:0;top:0;width:34%;height:auto;inset:auto 0 auto auto;position:absolute;animation:popIn .4s ease" aria-hidden="true">${glow(0, 0, 160, P.goldHi, 0.5)}<circle r="140" fill="none" stroke="${P.gold}" stroke-width="3" stroke-dasharray="6 8"/>${TRUTH[p.id]()}</svg>` : ""}
        </div>
        <div class="torch-row"><label for="torch">${U("torch")}</label><input id="torch" class="torch" type="range" min="0" max="100" value="${Math.round(t * 100)}" ${truth ? "disabled" : ""}></div>
        ${truth ? `<div style="display:flex;justify-content:center;width:100%">${feedbackHtml(answered === p.ans, T(p.e))}</div>`
          : `<div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${p.opts.map((o, k) => `<button class="opt" data-o="${k}" ${explored ? "" : "disabled style=\"opacity:.45\""}><span class="n">${k + 1}</span><span>${T(o)}</span></button>`).join("")}</div>`}
      </div>`;
      const r = $("#torch");
      if (r) r.oninput = () => {
        t = +r.value / 100;
        $("#shadowSvg").innerHTML = shadow();
        if (!explored && t > 0.55) { explored = true; AudioSys.sfx("whoosh"); ui.querySelectorAll(".opt").forEach(b => { b.disabled = false; b.style.opacity = ""; }); }
      };
    }
    function answer(k) {
      if (answered >= 0 || !explored) return;
      const p = puzzles[i]; answered = k;
      const ok = k === p.ans; results[i] = ok ? 1 : 0; if (!ok) mistakes++;
      AudioSys.sfx(ok ? "ok" : "bad");
      t = 1; draw();
      Voice.speak((ok ? U("wellDone") : U("notQuite")) + " " + T(p.e), "noctua");
    }
    function next() {
      i++; t = 0; explored = false; answered = -1;
      if (i >= puzzles.length) { Voice.stop(); done(mistakes); return; }
      AudioSys.sfx("page"); draw(); Voice.speak(U("whatIsIt"));
    }
    ui.onclick = e => {
      const o = e.target.closest("[data-o]"); if (o) { answer(+o.dataset.o); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "fbnext") next();
      if (b.dataset.k === "say") Voice.speak(T(ch.cave.intro));
    };
    keyH = e => {
      if (answered < 0 && ["1", "2", "3"].includes(e.key)) answer(+e.key - 1);
      else if (answered >= 0 && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
    };
    rerender = draw;
    draw();
    Voice.speak(T(ch.cave.intro), "noctua");
  });
}

function escapeGame(ch) {
  AudioSys.setMood("cave");
  clearScene();
  const steps = ch.cave.steps;
  let order = shuffle(steps.map((_, k) => k));
  let got = 0, mistakes = 0, fb = "", out = false;
  return ask(done => {
    const ui = $("#ui");
    function scene() {
      const lv = got / steps.length;
      const sky = `<rect x="-300" y="-300" width="2200" height="1500" fill="#0b0705"/>`;
      let s = sky;
      s += `<rect x="-300" y="-300" width="2200" height="1500" fill="#f6d98b" opacity="${(lv * 0.95).toFixed(2)}"/>`;
      s += glow(800, 120, 700 * (0.4 + lv), "#fff3c8", 0.3 + lv * 0.5);
      s += pth(`M-300 1200 L-300 ${700 - lv * 80} C300 ${640 - lv * 60} 1300 ${640 - lv * 60} 1900 ${700 - lv * 80} L1900 1200Z`, lv > 0.5 ? "#c87a3c" : "#24160d");
      if (got >= 1 && got < 3) s += g(SHADOWS.cat(1, "#00000066"), "translate(300 300) scale(.5)");
      if (got >= 2) s += pth("M500 790 C640 760 960 760 1100 790 C960 820 640 820 500 790Z", "#7fb0b8", `opacity=".85"`) + g(olive(0, 0, 0.6, P.ink, P.clay), "translate(800 790) scale(1 -0.5)", `opacity=".5"`);
      if (got >= 3) s += olive(320, 700, 1.0, P.ink, P.clay) + olive(1300, 690, 0.9, P.ink, P.clay);
      if (got === 4) s += moon(1300, 170, 40, P.slip, "#3a2a1c") + stars(30, 4, 0, 0, 1600, 300, P.slip);
      if (got >= 5) s += sunDisk(800, 160, 80, "#fff3c8", true);
      return s;
    }
    function draw() {
      ui.innerHTML = `<div class="ecl"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${scene()}</svg></div>
      <div class="cave-ui" style="justify-content:flex-end">
        <div class="ch-head"><div class="ins">${out ? T(ch.cave.outside) : T(ch.cave.escapeIntro)}</div><button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>
        <div style="flex:1"></div>
        ${out ? `<button class="btn big gold" data-k="end">${U("cont")} ${ICON.next}</button>` : `
        <div class="order-grid">${order.map(k => {
          const isDone = k < got;
          return `<button class="opt ${isDone ? "done" : ""}" data-s="${k}">${isDone ? `<span class="n" style="background:var(--ok)">${k + 1}</span>` : ""}<span>${T(steps[k])}</span></button>`;
        }).join("")}</div>
        <div style="min-height:60px;display:flex;justify-content:center;width:100%">${fb}</div>`}
      </div>`;
    }
    function pick(k) {
      if (out) return;
      if (k < got) return;
      if (k === got) {
        got++; fb = ""; AudioSys.sfx("ok");
        if (got === steps.length) { out = true; AudioSys.sfx("fanfare"); draw(); Voice.speak(T(ch.cave.outside), "noctua"); return; }
        draw(); Voice.speak(T(steps[k]));
      } else {
        mistakes++; AudioSys.sfx("bad");
        fb = feedbackHtml(false, T(ch.cave.wrong) + (!isPhi() ? ` → <b>${T(steps[got])}</b>` : ""), false);
        draw(); ui.querySelector(".order-grid")?.classList.add("shake");
        Voice.speak(T(ch.cave.wrong), "noctua");
      }
    }
    ui.onclick = e => {
      const s = e.target.closest("[data-s]"); if (s) { pick(+s.dataset.s); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "say") Voice.speak(out ? T(ch.cave.outside) : T(ch.cave.escapeIntro));
      if (b.dataset.k === "end") { Voice.stop(); done(mistakes); }
    };
    keyH = e => { if (out && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); Voice.stop(); done(mistakes); } };
    rerender = draw;
    draw();
    Voice.speak(T(ch.cave.escapeIntro), "noctua");
  });
}

function balanceSvg(angle, glowOn) {
  const r = angle * Math.PI / 180, L = 230;
  const lx = -L * Math.cos(r), ly = -L * Math.sin(r), rx = L * Math.cos(r), ry = L * Math.sin(r);
  const pan = (x, y) => ln(`M${x} ${y} L${x - 52} ${y + 70} M${x} ${y} L${x + 52} ${y + 70}`, P.ink, 2.4) + pth(`M${x - 66} ${y + 70} Q${x} ${y + 102} ${x + 66} ${y + 70}Z`, P.clay) + ln(`M${x - 60} ${y + 76} Q${x} ${y + 98} ${x + 60} ${y + 76}`, P.ink, 1.2);
  return `${glowOn ? glow(0, -110, 160, P.goldHi, 0.55) : ""}
    ${pth("M-16 120 L-10 -110 L10 -110 L16 120Z", P.ink)}<rect x="-70" y="112" width="140" height="18" rx="3" fill="${P.ink}"/>
    ${pth("M-7 -112 L0 -150 L7 -112Z", glowOn ? P.goldHi : P.gold)}
    <g>${ln(`M${lx} ${ly - 110} L${rx} ${ry - 110}`, P.ink, 10)}${circ(0, -110, 12, P.gold)}</g>
    ${pan(lx, ly - 110)}${pan(rx, ry - 110)}`;
}

function virtueGame(ch) {
  AudioSys.setMood("challenge");
  setScene("lyceum", { dim: 2 });
  const V = ch.virtue;
  const cards = shuffle(V.cards.filter(c => !c.pro || isPhi()));
  const results = cards.map(() => null);
  let i = 0, mistakes = 0, answered = -1, angle = 0, summary = false;
  return ask(done => {
    const ui = $("#ui");
    let anim = 0;
    function tweenTo(target) {
      cancelAnimationFrame(anim);
      const from = angle, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 650), e = 1 - Math.pow(1 - k, 3);
        angle = from + (target - from) * e + Math.sin(k * Math.PI * 3) * (1 - k) * 3;
        const sv = $("#bal"); if (sv) sv.innerHTML = balanceSvg(angle, answered >= 0 && answered === cards[i].a && cards[i].a === 1);
        if (k < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    function draw() {
      if (summary) return drawSummary();
      const c = cards[i];
      const labels = V.pos.map(T);
      ui.innerHTML = `<div class="ch-wrap">
        <div class="ch-head"><div class="ins">${T(V.intro)}</div>${pipsHtml(results, i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>
        <div class="vb">
          <svg id="bal" class="balance" viewBox="-320 -170 640 310" aria-hidden="true">${balanceSvg(angle, false)}</svg>
          <div class="vb-labels"><span>◀ ${labels[0]}</span><span>${labels[1]}</span><span>${labels[2]} ▶</span></div>
          <div class="ostrakon ${answered < 0 ? "in" : ""}" id="card" style="min-height:150px;width:min(640px,100%)"><div>${T(c.t)}</div></div>
          ${answered < 0 ? `<div class="vb-btns">${labels.map((l, k) => `<button class="opt" data-p="${k}"><span class="n">${["←", "↓", "→"][k]}</span><span>${l}</span></button>`).join("")}</div>`
            : `<div style="display:flex;justify-content:center;width:100%">${feedbackHtml(answered === c.a, T(c.e))}</div>`}
        </div></div>`;
    }
    function drawSummary() {
      const used = V.virtues.filter(v => !v.pro || isPhi());
      const labels = V.pos.map(T);
      ui.innerHTML = `<div class="ch-wrap"><div class="center-wrap" style="position:relative;inset:auto;padding:0;flex:1"><div class="panel meander" style="width:min(820px,100%)">
        <div class="kicker">${T(V.summary)}</div>
        <table class="vtable"><thead><tr><th>${labels[0]}</th><th class="mid">${labels[1]}</th><th>${labels[2]}</th></tr></thead>
        <tbody>${used.map(v => `<tr><td>${T(v.names[0])}</td><td class="mid">${T(v.names[1])}</td><td>${T(v.names[2])}</td></tr>`).join("")}</tbody></table>
        <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn big" data-k="end">${U("cont")} ${ICON.next}</button></div>
      </div></div></div>`;
    }
    function answer(p) {
      if (answered >= 0 || summary) return;
      const c = cards[i]; answered = p;
      const ok = p === c.a; results[i] = ok ? 1 : 0; if (!ok) mistakes++;
      AudioSys.sfx(ok ? "ok" : "bad");
      draw(); tweenTo([-16, 0, 16][p]);
      Voice.speak((ok ? U("wellDone") : U("notQuite")) + " " + T(c.e), "noctua");
    }
    function next() {
      if (summary) { Voice.stop(); cancelAnimationFrame(anim); done(mistakes); return; }
      answered = -1; i++;
      if (i >= cards.length) { summary = true; AudioSys.sfx("fanfare"); draw(); Voice.speak(T(V.summary), "noctua"); return; }
      AudioSys.sfx("page"); draw(); tweenTo(0); Voice.speak(T(cards[i].t));
    }
    ui.onclick = e => {
      const b0 = e.target.closest("[data-p]"); if (b0) { answer(+b0.dataset.p); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "fbnext" || b.dataset.k === "end") next();
      if (b.dataset.k === "say") Voice.speak(T(V.intro) + " " + T(cards[i].t));
    };
    keyH = e => {
      if (answered < 0 && !summary) {
        if (e.key === "ArrowLeft") answer(0); else if (e.key === "ArrowDown") { e.preventDefault(); answer(1); } else if (e.key === "ArrowRight") answer(2);
        else if (["1", "2", "3"].includes(e.key)) answer(+e.key - 1);
      } else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); }
    };
    rerender = draw;
    draw();
    Voice.speak(T(V.intro) + " " + T(cards[0].t), "noctua");
  });
}

function logicGame(ch) {
  AudioSys.setMood("challenge");
  setScene("lyceum", { dim: 2 });
  const L = ch.logic;
  const items = L.items.filter(x => !x.pro || isPhi());
  const results = items.map(() => null);
  let i = 0, mistakes = 0, answered = null;
  let order = shuffle([0, 1, 2]);
  return ask(done => {
    const ui = $("#ui");
    function draw() {
      const it = items[i];
      const ok = answered !== null && (it.type === "complete" ? answered === it.ans : answered === it.ans);
      let conclusion;
      if (it.type === "complete") conclusion = answered !== null ? `<b>${T(it.opts[it.ans])}</b>` : `<span class="blank">_____________</span>`;
      else conclusion = `<b>${T(it.c).replace(/^(Por tanto|Donc),?\s*/i, "")}</b>`;
      ui.innerHTML = `<div class="ch-wrap">
        <div class="ch-head"><div class="ins">${T(L.intro)}</div>${pipsHtml(results, i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>
        <div class="tablet">
          ${it.p.map((p, k) => `<p class="prem"><span class="pn">${k + 1}</span>${T(p)}</p>`).join("")}
          <p class="ther"><span class="pn">∴</span>${T(L.therefore)} ${conclusion}</p>
        </div>
        ${answered === null ? (it.type === "complete"
            ? `<div class="opts">${order.map((o, n) => `<button class="opt" data-o="${o}"><span class="n">${n + 1}</span><span>${T(it.opts[o])}</span></button>`).join("")}</div>`
            : `<p class="lead" style="text-align:center;margin:0">${T(L.askCheck)}</p><div class="yn"><button class="opt" data-o="1"><span class="n">1</span><span>${T(L.yes)}</span></button><button class="opt" data-o="0"><span class="n">2</span><span>${T(L.no)}</span></button></div>`)
          : `<div style="display:flex;justify-content:center;width:100%">${feedbackHtml(ok, T(it.e))}</div>`}
      </div>`;
    }
    function say() { const it = items[i]; Voice.speak(it.p.map(T).join(" ") + " " + (it.type === "complete" ? T(L.therefore) : T(it.c) + " " + T(L.askCheck))); }
    function answer(v) {
      if (answered !== null) return;
      const it = items[i];
      answered = it.type === "complete" ? v : v === 1;
      const ok = answered === it.ans;
      results[i] = ok ? 1 : 0; if (!ok) mistakes++;
      AudioSys.sfx(ok ? "ok" : "bad"); draw();
      Voice.speak((ok ? U("wellDone") : U("notQuite")) + " " + T(it.e), "noctua");
    }
    function next() {
      answered = null; i++; order = shuffle([0, 1, 2]);
      if (i >= items.length) { Voice.stop(); done(mistakes); return; }
      AudioSys.sfx("page"); draw(); say();
    }
    ui.onclick = e => {
      const o = e.target.closest("[data-o]"); if (o) { answer(+o.dataset.o); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "fbnext") next();
      if (b.dataset.k === "say") say();
    };
    keyH = e => {
      const it = items[i];
      if (answered === null && ["1", "2", "3"].includes(e.key)) {
        const n = +e.key - 1;
        if (it.type === "complete") answer(order[n]); else if (n < 2) answer(n === 0 ? 1 : 0);
      } else if (answered !== null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
    };
    rerender = draw;
    draw(); say();
  });
}


/* =====================================================================
   CAPÍTULO 5 · DIÓGENES — «La mochila de Diógenes» (arcade)

GAMES.diogenes = async function (ch) {
  const m = await packGame(ch);

function packGame(ch) {
  AudioSys.setMood("challenge");
  clearScene();
  const K = ch.pack;
  const phi = isPhi();
  const needs = K.items.filter(it => it.need);
  const wants = K.items.filter(it => !it.need && (!it.pro || phi));
  let queue = shuffle(needs.concat(wants, phi ? shuffle(needs).slice(0, 2) : []));
  // que no empiece con dos caprichos seguidos
  if (!queue[0].need) { const k = queue.findIndex(q => q.need); [queue[0], queue[k]] = [queue[k], queue[0]]; }
  const FALL = phi ? 250 : 175, GAP = phi ? 1.15 : 1.55, BASE = phi ? 820 : 720;
  const CATCH_Y = 676, GROUND = 880;
  let px = 800, target = null, weight = 0, mistakes = 0, spawned = 0, timeToSpawn = 0.6, last = 0;
  let falling = [], caught = [], floats = [], started = false, finished = false;
  const keys = { l: false, r: false };
  return ask(done => {
    const ui = $("#ui");
    function playerSvg() {
      const sw = 1 + weight * 0.22;
      return fig({ x: 0, y: 0, s: 0.9, front: "hold", hair: "wild", beard: "long", back: "down" })
        + g(pth("M-58 0 C-70 70 50 78 58 0 C40 -10 -40 -10 -58 0Z", P.clayLo) + ell(0, 0, 58, 14, P.ink) + ell(0, 0, 50, 10, "#0b0604")
          + ln("M-40 34 Q0 46 40 34", P.ink, 1.4) + (weight ? g(Array.from({ length: Math.min(weight, 6) }, (_, k) => circ(-30 + k * 12, -10 - (k % 2) * 8, 9, P.gold)).join(""), "") : ""),
          `translate(64 -178) scale(${sw})`);
    }
    function itemSvg(it) {
      return g(circ(0, 0, 50, P.ink, `opacity=".88"`) + `<circle r="50" fill="none" stroke="${P.clay}" stroke-width="3"/>` + g(itemIcon(it.id), "scale(1.05)")
        + `<text y="80" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="28" fill="${P.slip}" stroke="${P.ink}" stroke-width="6" paint-order="stroke">${esc(T(it.n))}</text>`, `translate(${it.x.toFixed(1)} ${it.y.toFixed(1)})`);
    }
    function freedom() { return Math.max(0, 100 - weight * 20); }
    function hud() {
      return `<div class="ch-head"><div class="ins">${T(K.intro)}</div>
        <div class="fogmeter" style="color:var(--goldHi)">${T(K.freedom)}<span class="bar"><i style="width:${freedom()}%;background:linear-gradient(90deg,var(--gold),var(--goldHi))"></i></span></div>
        <button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>`;
    }
    function frame() {
      return `<svg id="arena" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="touch-action:none">
        ${SCENES.backpackField()}
        <g id="items">${falling.map(itemSvg).join("")}</g>
        <g id="player" transform="translate(${px.toFixed(1)} ${GROUND - 20})">${playerSvg()}</g>
        <g id="floats">${floats.map(f => `<text x="${f.x}" y="${f.y}" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="34" fill="${f.ok ? "#bfe39a" : "#ffb39a"}" stroke="${P.ink}" stroke-width="6" paint-order="stroke" opacity="${Math.min(1, f.life).toFixed(2)}">${esc(f.t)}</text>`).join("")}</g>
      </svg>`;
    }
    function draw() {
      if (finished) return drawEnd();
      ui.innerHTML = `<div class="ecl">${frame()}</div>
        <div class="ch-wrap" style="position:absolute;inset:0 0 auto 0;overflow:visible;pointer-events:none"><div style="pointer-events:auto;width:min(1100px,100%)">${hud()}</div></div>
        ${started ? "" : `<div class="center-wrap" style="background:rgba(12,8,6,.55)"><div class="panel meander" style="width:min(600px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center">
            <div class="pk-demo"><div class="pk"><svg viewBox="-42 -42 84 84" aria-hidden="true">${itemIcon("agua")}</svg><span>${T(K.items[0].n)}</span><b class="okc">✓ ${T(K.catchIt)}</b></div>
              <div class="pk bad"><svg viewBox="-42 -42 84 84" aria-hidden="true">${itemIcon("corona")}</svg><span>${T(K.items[6].n)}</span><b class="badc">✗ ${T(K.dropIt)}</b></div></div>
            <p class="lead">${T(K.intro)}</p><span class="chip">${T(K.controls)}</span>
            <button class="btn big gold" data-k="start">${ICON.play} ${T(K.startBtn)}</button></div></div>`}`;
      bindPointer();
    }
    function drawEnd() {
      ui.innerHTML = `<div class="ecl">${frame()}</div>
        <div class="center-wrap" style="background:rgba(12,8,6,.6)"><div class="panel meander" style="width:min(720px,100%);display:flex;flex-direction:column;gap:16px">
          <div class="kicker">${T(K.got)}</div>
          <div class="packrow">${caught.length ? caught.map(it => `<div class="pk ${it.need ? "" : "bad"}"><svg viewBox="-42 -42 84 84" aria-hidden="true">${itemIcon(it.id)}</svg><span>${esc(T(it.n))}</span></div>`).join("") : "—"}</div>
          <div class="fogmeter" style="color:var(--goldHi)">${T(K.freedom)} ${freedom()}%<span class="bar" style="width:220px"><i style="width:${freedom()}%;background:linear-gradient(90deg,var(--gold),var(--goldHi))"></i></span></div>
          ${feedbackHtml(mistakes <= 2, T(K.end), false)}
          <div style="display:flex;justify-content:flex-end"><button class="btn big gold" data-k="end">${U("cont")} ${ICON.next}</button></div>
        </div></div>`;
    }
    function paint() {
      const it = $("#items"), pl = $("#player"), fl = $("#floats");
      if (!it) return;
      it.innerHTML = falling.map(itemSvg).join("");
      pl.setAttribute("transform", `translate(${px.toFixed(1)} ${GROUND - 20})`);
      pl.innerHTML = playerSvg();
      fl.innerHTML = floats.map(f => `<text x="${f.x}" y="${f.y.toFixed(0)}" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="34" fill="${f.ok ? "#bfe39a" : "#ffb39a"}" stroke="${P.ink}" stroke-width="6" paint-order="stroke" opacity="${Math.min(1, f.life).toFixed(2)}">${esc(f.t)}</text>`).join("");
      const bar = ui.querySelector(".fogmeter .bar i"); if (bar) bar.style.width = freedom() + "%";
    }
    function float(t, x, ok) { floats.push({ t, x, y: CATCH_Y - 60, ok, life: 1.6 }); }
    function visRange() {
      const sv = $("#arena"); if (!sv) return [0, 1600];
      const r = sv.getBoundingClientRect(); if (!r.width) return [0, 1600];
      const sc = Math.max(r.width / 1600, r.height / 900), w = Math.min(1600, r.width / sc);
      return [800 - w / 2, 800 + w / 2];
    }
    function loop(now) {
      if (!last) last = now;
      const [vx0, vx1] = visRange();
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const speed = BASE * Math.max(0.35, 1 - 0.17 * weight);
      if (keys.l) px -= speed * dt; if (keys.r) px += speed * dt;
      if (target !== null && !keys.l && !keys.r) { const d = target - px; px += Math.sign(d) * Math.min(Math.abs(d), speed * dt); }
      px = Math.max(vx0 + 60, Math.min(vx1 - 130, px));
      timeToSpawn -= dt;
      if (timeToSpawn <= 0 && spawned < queue.length) {
        const it = Object.assign({}, queue[spawned++]); const mg = Math.min(170, (vx1 - vx0) * 0.24); it.x = vx0 + mg + Math.random() * Math.max(10, vx1 - vx0 - 2 * mg); it.y = -70; falling.push(it); timeToSpawn = GAP;
      }
      const mouthX = px + 58;
      falling = falling.filter(it => {
        it.y += FALL * dt;
        if (it.y >= CATCH_Y - 30 && it.y <= CATCH_Y + 30 && Math.abs(it.x - mouthX) < 80) {
          caught.push(it);
          if (it.need) { AudioSys.sfx("coin"); float("+ " + T(it.n), mouthX, true); }
          else { weight++; mistakes++; AudioSys.sfx("bad"); float(T(K.heavy), mouthX, false); }
          return false;
        }
        if (it.y > GROUND + 60) { if (it.need) { mistakes++; AudioSys.sfx("bad"); float(T(K.lost), Math.max(vx0 + 200, Math.min(vx1 - 200, it.x)), false); } return false; }
        return true;
      });
      floats.forEach(f => { f.y -= 50 * dt; f.life -= dt; }); floats = floats.filter(f => f.life > 0);
      paint();
      if (spawned >= queue.length && !falling.length) { later(() => { finished = true; AudioSys.sfx("fanfare"); draw(); Voice.speak(T(K.end), "noctua"); }, 700); return; }
      rafId = requestAnimationFrame(loop);
    }
    function bindPointer() {
      const sv = $("#arena"); if (!sv) return;
      const toX = e => { const r = sv.getBoundingClientRect(); const sc = Math.max(r.width / 1600, r.height / 900); const ox = (r.width - 1600 * sc) / 2; return (e.clientX - r.left - ox) / sc - 58; };
      sv.onpointerdown = e => { target = toX(e); sv.setPointerCapture?.(e.pointerId); };
      sv.onpointermove = e => { if (e.pointerType === "mouse" || e.buttons) target = toX(e); };
    }
    function start() { if (started) return; started = true; AudioSys.sfx("whoosh"); draw(); last = 0; rafId = requestAnimationFrame(loop); }
    const up = e => { if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.l = false; if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.r = false; };
    document.addEventListener("keyup", up); addCleanup(() => document.removeEventListener("keyup", up));
    ui.onclick = e => {
      const b = e.target.closest("[data-k]"); if (!b) return;
      if (b.dataset.k === "start") start();
      if (b.dataset.k === "say") Voice.speak(T(K.intro), "noctua");
      if (b.dataset.k === "end") { Voice.stop(); document.removeEventListener("keyup", up); done(mistakes); }
    };
    keyH = e => {
      if (!started && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); start(); return; }
      if (finished && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ui.querySelector("[data-k=end]")?.click(); return; }
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") { keys.l = true; target = null; }
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") { keys.r = true; target = null; }
    };
    rerender = draw;
    draw();
    Voice.speak(T(K.intro), "noctua");
  });
}


/* =====================================================================
   CAPÍTULO 6 · CONFUCIO — «El espejo de bronce»
   Cada ronda: una situación de la vida diaria. El espejo muestra la cara
   de la otra persona (empatía) y luego se elige qué hacer pasando la
   «prueba de Confucio»: ¿te gustaría que te lo hicieran a ti? (reciprocidad)
   Aprendiz: primero se gira el espejo y luego se adivina el sentimiento.
   Filósofo: se adivina el sentimiento solo con la situación; el espejo
   lo confirma después. Además tiene dos rondas más difíciles.
   ===================================================================== */
const FEM_FACES = ["girl", "girl2"];
function feelLabel(k, kind) { const f = FEELINGS[k]; if (!f) return ""; const arr = f[S.lang] || f.es; return arr[FEM_FACES.includes(kind) ? 1 : 0]; }
function feelIcon(k) { return `<svg viewBox="-90 -100 180 200" aria-hidden="true">${faceSvg("neutral", k === "unknown" ? "unknown" : k)}</svg>`; }

GAMES.confucio = function (ch) {
  AudioSys.setMood("challenge");
  setScene("mirrorPlay", { dim: 1 });
  setFog(0.5);
  const K = ch.mirror;
  const phi = isPhi();
  const rounds = K.rounds.filter(r => !r.pro || phi);
  const results = rounds.map(() => null);
  let i = 0, mistakes = 0, phase = "", finished = false, wrongF = new Set(), wrongA = new Set(), fb = "", hintShown = false, mirrorFront = false, mood = "";
  let feelOrder = [], actOrder = [];
  function startRound() {
    const r = rounds[i];
    phase = phi ? "feel" : "look"; mirrorFront = false; mood = r.show;
    wrongF = new Set(); wrongA = new Set(); fb = ""; hintShown = false;
    feelOrder = shuffle(r.opts); actOrder = shuffle(r.acts.map((_, k) => k));
  }
  return ask(done => {
    const ui = $("#ui");
    function fogPct() { return Math.round(100 * results.filter(x => x === null).length / rounds.length); }
    function mirrorSvg(r) {
      const front = mirrorFront ? faceSvg(r.face, mood, 1.55) : "";
      return `<svg class="mr-svg ${mirrorFront ? "front" : "back"}" viewBox="-200 -200 400 440" aria-hidden="true">
        ${ln("M0 180 L0 222 M-70 226 L70 226", CN.bronzeLo, 12)}
        <g class="mr-disc">${bronzeMirror(180, mirrorFront ? "front" : "back", front)}</g></svg>`;
    }
    function head() {
      return `<div class="ch-head"><div class="ins">${T(phi ? K.introPhi : K.intro)}</div><div class="fogmeter">${U("fogLeft")}<span class="bar"><i style="width:${fogPct()}%"></i></span></div>${pipsHtml(results, finished ? -1 : i)}<button class="ibtn" data-k="say" aria-label="${U("replay")}">${ICON.speaker}</button></div>`;
    }
    function draw() {
      if (finished) {
        ui.innerHTML = `<div class="ch-wrap">${head()}<div class="mr-stage"><div class="mr-mirror"><svg viewBox="-200 -340 400 360" aria-hidden="true">${glow(0, -170, 190, CN.bronzeHi, 0.35)}${fig(confucioLook({ x: 0, y: 0, s: 1.05, fill: P.ink, line: P.clay, front: "out", back: "down" }))}</svg></div>
          <div class="mr-side" style="justify-content:center;align-items:center">${feedbackHtml(true, T(K.win), false)}<button class="btn big gold" data-k="end">${U("cont")} ${ICON.next}</button></div></div></div>`;
        return;
      }
      const r = rounds[i];
      const who = T(r.who);
      let panel = `<div class="mr-sit panel"><div class="kicker">${U("chapter")} ${toRoman(ch.num)} · ${i + 1}/${rounds.length}</div><p>${T(r.sit)}</p></div>`;
      if (phase === "look") {
        panel += `<div class="mr-actions"><button class="btn big gold next-pulse" data-k="turn">${ICON.next} ${T(K.turn)}</button></div>`;
      } else if (phase === "feel") {
        panel += `<p class="mr-q">${T(K.feelQ).replace("{who}", who)}</p>
          <div class="feel-grid">${feelOrder.map((k, n) => `<button class="feel-btn ${wrongF.has(k) ? "bad" : ""}" data-f="${k}" ${wrongF.has(k) ? "disabled" : ""}><span class="n">${n + 1}</span>${feelIcon(k)}<span class="lb">${esc(feelLabel(k, r.face))}</span></button>`).join("")}</div>`;
      } else if (phase === "act" || phase === "solved") {
        panel += `<p class="mr-q">${T(K.actQ)} <span class="chip">${T(K.ruleTest)}</span></p>`;
        if (phase === "act") panel += `<div class="opts">${actOrder.map((k, n) => `<button class="opt ${wrongA.has(k) ? "bad" : ""}" data-a="${k}" ${wrongA.has(k) ? "disabled" : ""}><span class="n">${n + 1}</span><span>${T(r.acts[k].t)}</span></button>`).join("")}</div>`;
        else { const good = r.acts.find(a => a.ok); panel += `<div class="opts"><div class="opt good"><span class="n">✓</span><span>${T(good.t)}</span></div></div>`; }
      }
      const hintBtn = !phi && !hintShown && !fb && (phase === "feel" || phase === "act") ? `<button class="btn ghost small" data-k="hint">${ICON.hint} ${U("hint")}</button>` : "";
      const nextBtn = phase === "solved" ? `<button class="btn big" data-k="next">${U("next")} ${ICON.next}</button>` : "";
      ui.innerHTML = `<div class="ch-wrap">${head()}
        <div class="mr-stage">
          <div class="mr-mirror">${mirrorFront ? `<div class="mr-name">${esc(who)}</div>` : ""}${mirrorSvg(r)}</div>
          <div class="mr-side">${panel}<div id="fb" class="mr-fb">${fb}${hintBtn}${nextBtn}</div></div>
        </div></div>`;
    }
    function sayNow() {
      const r = rounds[i];
      if (finished) return Voice.speak(T(K.win), "noctua");
      if (phase === "look") return Voice.speak(T(r.sit));
      if (phase === "feel") return Voice.speak((phi ? T(r.sit) + " " : "") + T(K.feelQ).replace("{who}", T(r.who)) + " " + feelOrder.map((k, n) => (n + 1) + ": " + feelLabel(k, r.face)).join(". "));
      if (phase === "act") return Voice.speak(T(K.actQ) + " " + actOrder.map((k, n) => (n + 1) + ": " + T(r.acts[k].t)).join(". "));
    }
    function turn() {
      if (phase !== "look") return;
      mirrorFront = true; phase = "feel"; AudioSys.sfx("whoosh"); draw();
      ui.querySelector(".mr-svg")?.classList.add("flip");
      sayNow();
    }
    function chooseFeel(k) {
      const r = rounds[i];
      if (phase !== "feel" || wrongF.has(k)) return;
      if (r.feel.includes(k)) {
        AudioSys.sfx("ok");
        const flipNow = !mirrorFront;
        mirrorFront = true; phase = "act"; hintShown = false;
        fb = feedbackHtml(true, T(K.feelOk), false);
        draw();
        if (flipNow) { AudioSys.sfx("whoosh"); ui.querySelector(".mr-svg")?.classList.add("flip"); }
        Voice.speak(T(K.feelOk) + " " + T(K.actQ) + " " + actOrder.map((kk, n) => (n + 1) + ": " + T(r.acts[kk].t)).join(". "));
      } else {
        wrongF.add(k); mistakes++; if (results[i] === null) results[i] = 0;
        AudioSys.sfx("bad");
        fb = feedbackHtml(false, T(K.feelBad), false);
        draw(); ui.querySelector(".feel-grid")?.classList.add("shake");
        Voice.speak(T(K.feelBad), "noctua");
      }
    }
    function chooseAct(k) {
      const r = rounds[i];
      if (phase !== "act" || wrongA.has(k)) return;
      const a = r.acts[k];
      if (a.ok) {
        phase = "solved"; if (results[i] === null) results[i] = 1;
        mood = "happy";
        AudioSys.sfx("ok"); later(() => AudioSys.sfx("coin"), 300);
        fb = feedbackHtml(true, T(a.r), false);
        setFog(0.5 * fogPct() / 100);
        draw();
        Voice.speak(T(a.r), "noctua");
      } else {
        wrongA.add(k); mistakes++; if (results[i] === null) results[i] = 0;
        AudioSys.sfx("bad");
        fb = feedbackHtml(false, T(a.r), false);
        draw(); ui.querySelector(".opts")?.classList.add("shake");
        Voice.speak(T(a.r), "noctua");
      }
    }
    function next() {
      if (phase !== "solved") return;
      i++;
      if (i >= rounds.length) {
        finished = true; setFog(0); AudioSys.sfx("fogout"); later(() => AudioSys.sfx("fanfare"), 600);
        draw(); Voice.speak(T(K.win), "noctua"); return;
      }
      AudioSys.sfx("page"); startRound(); draw(); sayNow();
    }
    ui.onclick = e => {
      const f = e.target.closest("[data-f]"); if (f) { chooseFeel(f.dataset.f); return; }
      const a = e.target.closest("[data-a]"); if (a) { chooseAct(+a.dataset.a); return; }
      const b = e.target.closest("[data-k]"); if (!b) return;
      const k = b.dataset.k;
      if (k === "turn") turn();
      if (k === "next") next();
      if (k === "say") sayNow();
      if (k === "hint") { hintShown = true; fb = `<div class="feedback" style="border-color:var(--gold)"><span class="mark" style="color:var(--goldHi)">${U("hint")}</span><p>${T(phase === "act" ? K.ruleTest : K.hint)}</p></div>`; draw(); Voice.speak(T(phase === "act" ? K.ruleTest : K.hint), "noctua"); }
      if (k === "end") { Voice.stop(); done({ stars: starsFromMistakes(mistakes) }); }
    };
    keyH = e => {
      if (finished) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ui.querySelector("[data-k=end]")?.click(); } return; }
      if (phase === "look" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); turn(); return; }
      if (phase === "feel" && /^[1-4]$/.test(e.key)) { const k = feelOrder[+e.key - 1]; if (k) chooseFeel(k); return; }
      if (phase === "act" && /^[1-3]$/.test(e.key)) { const k = actOrder[+e.key - 1]; if (k != null) chooseAct(k); return; }
      if (phase === "solved" && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); next(); }
    };
    rerender = draw;
    startRound(); draw(); sayNow();
  });
};


boot();

</script>
